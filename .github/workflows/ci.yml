name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y busybox-static
      - run: pip install -e ".[dev,zstd]"
      - run: ruff check src tests
      - run: xcrunner info
      # cwltool is not installed in this job, so the cwltool-marked tests skip by design.
      - run: pytest -q -rs
      - run: XCODON_TEST_NETWORK=1 pytest -q -rs -m network
  # The Mac side only: no VM on GitHub's macOS runners. Catches Linux-only imports
  # and runs the tests that do not need Linux (spec 16.10).
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,zstd]"
      - run: python -c "import xcodon_runtime.cli, xcodon_runtime.macvm, xcodon_runtime.forwarded"
      - run: xcrunner --version
      - run: pytest -q -rs tests/test_macvm.py tests/test_macvm_forward.py tests/test_forwarded.py tests/test_micromamba_platforms.py
