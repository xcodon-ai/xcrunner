[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xcrunner"
version = "0.1.6"
description = "Rootless container runtime for Docker images, built for coala"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
# zstd layers: Python 3.14+ reads them with the stdlib (compression.zstd).
dependencies = ['zstandard>=0.21; python_version < "3.14"']

[project.optional-dependencies]
# Kept so `pip install 'xcrunner[zstd]'` still works; zstd support is now built in.
zstd = []
# The udocker engine, for hosts that block user namespaces and ptrace (spec section 17).
udocker = ["udocker>=1.3.17"]
dev = ["pytest>=8", "ruff>=0.4", "pyyaml>=6"]

[project.scripts]
xcrunner = "xcodon_runtime.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/xcodon_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "network: needs internet access",
  "ns: needs unprivileged user namespaces and overlayfs",
  "proot: needs a PRoot binary",
  "docker: needs a local docker daemon",
  "cwltool: needs cwltool installed",
  "coala_runtime: needs coala-runtime installed",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Ruff's documented default rules, pinned so a newer ruff cannot widen the set
# under CI and fail the build over style this project never chose.
select = ["E4", "E7", "E9", "F"]
# The manifest and layer loops read `for l in doc["layers"]`, which the plan's
# own snippets use; renaming the loop variable everywhere buys nothing.
ignore = ["E741"]
